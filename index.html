<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChillerQA 냉매관리시스템</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f3f6fa;color:#172033}
header{background:#123e65;color:white;padding:20px 16px}header h1{margin:0;font-size:22px}header p{margin:7px 0 0;color:#c9d9e8;font-size:13px}
main{max-width:1000px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0000000c;margin-bottom:14px}.stat small{color:#68758a}.stat strong{display:block;font-size:24px;margin-top:6px}
nav{display:flex;overflow:auto;gap:8px;margin:14px 0}nav button{white-space:nowrap;border:0;padding:10px 13px;border-radius:10px;background:#dce6f0;color:#123e65;font-weight:700}nav button.active{background:#123e65;color:white}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:#1565a8;color:white;font-weight:650}button.secondary{background:#e7edf4;color:#183b59}button.danger{background:#b83232}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd6e1;border-radius:9px;font-size:15px;background:white}label{display:block;font-size:13px;color:#46566a;margin:10px 0 5px}form .grid{gap:10px}.hide{display:none!important}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e8edf2}th{color:#52647a;font-size:12px}td{word-break:break-word}.scroll{overflow:auto}.pill{font-size:12px;padding:4px 8px;border-radius:20px;background:#e9f4ff;color:#17578b}.muted{color:#718096;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px}.notice{background:#fff7df;border:1px solid #f1d58b;border-radius:12px;padding:12px;color:#745314;font-size:13px}
#reader{width:100%;max-width:480px;margin:auto}#qrprint{display:flex;flex-wrap:wrap;gap:12px}.labelbox{border:1px dashed #aaa;padding:12px;width:180px;text-align:center;background:white}
@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}main{padding:12px}.card{padding:13px}header{padding:16px}}
@media print{header,nav,.noprint,.notice{display:none!important}body{background:white}main{padding:0}.labelbox{break-inside:avoid}}

#intro{position:fixed;inset:0;z-index:9999;background:#071b3b;color:white;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity 1.25s ease,visibility 1.25s ease}
#intro.fade{opacity:0;visibility:hidden}#intro h1{font-size:clamp(24px,6vw,40px);letter-spacing:.04em;padding:24px;animation:introGlow 1.5s ease-in-out infinite alternate}
@keyframes introGlow{from{opacity:.65;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.small{font-size:12px;color:#64748b}.low{color:#b83232;font-weight:700}.category-row{display:flex;gap:8px;align-items:center;margin:8px 0}.category-row input{flex:1}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
</head><body>
<div id="intro"><h1>ChillerQA냉매관리시스템</h1></div>
<header><h1>♻️ ChillerQA 냉매관리시스템</h1><p>입고 · 사용 · 회수 · 월별 재고 및 소모량</p></header>
<main>
<div class="notice">현재 버전은 이 브라우저에 데이터가 저장되는 MVP입니다. 공유 서버 연결 전에는 다른 휴대폰/PC와 데이터가 공유되지 않습니다. 브라우저 데이터 삭제 시 기록이 사라질 수 있으니 CSV 백업을 권장합니다.</div>
<div class="stats" id="stats"></div>
<nav class="noprint" id="nav"></nav>
<section id="view"></section>
</main>
<script>
const KEY='refrigerant_qr_inventory_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"cylinders":[],"logs":[]}');
let settings=JSON.parse(localStorage.getItem(KEY+'_settings')||'null')||{refrigerants:['R-134a','R-410A','R-1234ze','R-1234yf','R-32','R-407C','R-513A'],thresholds:{},emails:[],frequency:'monthly'};
if(!settings.refrigerants)settings.refrigerants=[];if(!settings.thresholds)settings.thresholds={};if(!settings.emails)settings.emails=[];function saveSettings(){localStorage.setItem(KEY+'_settings',JSON.stringify(settings));render()}
let tab='dashboard', scanner=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function categoryStock(r){return data.cylinders.filter(c=>c.refrigerant===r).reduce((sum,c)=>sum+balance(c),0)}
function lowCategories(){return settings.refrigerants.filter(r=>Number(settings.thresholds[r]||0)>0&&categoryStock(r)<=Number(settings.thresholds[r]))}
function fmt(n){return (Number(n)||0).toLocaleString('ko-KR',{maximumFractionDigits:3})+' kg'}
function balance(c){return c.initial+data.logs.filter(x=>x.cylinderId===c.id).reduce((s,x)=>s+(x.type==='in'?x.qty:x.type==='recovery'?x.qty:-x.qty),0)}
function totals(){let incoming=data.cylinders.reduce((s,c)=>s+c.initial,0)+data.logs.filter(x=>x.type==='in').reduce((s,x)=>s+x.qty,0);let used=data.logs.filter(x=>x.type==='use').reduce((s,x)=>s+x.qty,0);let recovered=data.logs.filter(x=>x.type==='recovery').reduce((s,x)=>s+x.qty,0);let stock=data.cylinders.reduce((s,c)=>s+balance(c),0);return {incoming,used,recovered,stock}}
function nav(){let arr=[['dashboard','대시보드'],['cylinders','용기/재고'],['entry','입고 등록'],['use','사용 등록'],['recovery','회수 등록'],['scan','QR 스캔'],['monthly','월별 통계'],['labels','QR 라벨'],['history','이력'],['settings','냉매/알림 설정']];document.getElementById('nav').innerHTML=arr.map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${t}</button>`).join('')}
function stats(){let t=totals();document.getElementById('stats').innerHTML=`<div class="card stat"><small>현재 보유량</small><strong>${fmt(t.stock)}</strong></div><div class="card stat"><small>누적 입고량</small><strong>${fmt(t.incoming)}</strong></div><div class="card stat"><small>누적 소모량</small><strong>${fmt(t.used)}</strong></div><div class="card stat"><small>누적 회수량</small><strong>${fmt(t.recovered)}</strong></div>`}
function cylinderSelect(){return data.cylinders.map(c=>`<option value="${c.id}">${c.code} · ${c.refrigerant} · 잔량 ${fmt(balance(c))}</option>`).join('')}
function viewDashboard(){let t=totals();let lows=lowCategories();return `
${lows.length?`<div class="card"><h3 class="low">⚠ 재고 기준 이하</h3>${lows.map(r=>`<p class="low">${r}: ${fmt(categoryStock(r))} / 기준 ${fmt(settings.thresholds[r])}</p>`).join('')}<p class="muted">메일 자동 발송은 서버/메일 서비스 연결 전이며, 현재는 웹앱 내 경고 표시만 제공합니다.</p></div>`:''}<div class="card"><h3>재고 요약</h3><div class="scroll"><table><thead><tr><th>냉매</th><th>용기 수</th><th>총 잔량</th></tr></thead><tbody>${[...new Set(data.cylinders.map(c=>c.refrigerant))].map(r=>{let cs=data.cylinders.filter(c=>c.refrigerant===r);return `<tr><td>${r}</td><td>${cs.length}</td><td>${fmt(cs.reduce((s,c)=>s+balance(c),0))}</td></tr>`}).join('')||'<tr><td colspan="3">등록된 용기가 없습니다.</td></tr>'}</tbody></table></div></div><div class="card"><h3>최근 활동</h3>${recent(5)}</div>`}
function viewCylinders(){return `<div class="card"><h3>냉매 종류별 재고</h3><div class="scroll"><table><thead><tr><th>냉매</th><th>총 잔량</th><th>기준량</th><th>상태</th></tr></thead><tbody>${settings.refrigerants.map(r=>{let st=categoryStock(r),th=Number(settings.thresholds[r]||0);return `<tr><td>${r}</td><td>${fmt(st)}</td><td>${th?fmt(th):'-'}</td><td>${th&&st<=th?'<span class="low">기준 이하</span>':'정상'}</td></tr>`}).join('')}</tbody></table></div></div>`+`<div class="card"><h3>용기 목록</h3><div class="scroll"><table><thead><tr><th>QR ID</th><th>냉매</th><th>용기번호</th><th>입고</th><th>잔량</th><th>위치</th></tr></thead><tbody>${data.cylinders.map(c=>`<tr><td>${c.id}</td><td>${c.refrigerant}</td><td>${c.code}</td><td>${fmt(c.initial)}</td><td>${fmt(balance(c))}</td><td>${c.location||'-'}</td></tr>`).join('')||'<tr><td colspan="6">용기를 등록하세요.</td></tr>'}</tbody></table></div></div>`}
function cylinderForm(mode){return `<div class="card"><h3>${mode==='in'?'냉매 입고 등록':'냉매 사용/회수 등록'}</h3><form id="logform"><div class="grid"><div><label>용기 선택</label><select name="cylinder" required>${cylinderSelect()}</select></div><div><label>수량 (kg)</label><input name="qty" type="number" min="0.001" step="0.001" required placeholder="kg 입력"></div><div><label>날짜</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>작업자</label><input name="person" placeholder="작업자"></div><div><label>제품/시험기/작업</label><input name="work" placeholder="예: CH-001 시험"></div><div><label>메모</label><input name="note" placeholder="메모 (선택)"></div></div><button style="margin-top:14px">${mode==='in'?'입고 기록 저장':'기록 저장'}</button></form></div>`}
function viewEntry(){return `<div class="card"><h3>새 용기 입고 및 QR 등록</h3><form id="cform"><div class="grid"><div><label>냉매 종류</label><select name="refrigerant" required>${settings.refrigerants.map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div><div><label>용기 번호</label><input name="code" required placeholder="예: CY-2026-001"></div><div><label>입고량 (kg)</label><input name="qty" type="number" min="0.001" step="0.001" required></div><div><label>입고 날짜</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>보관 위치</label><input name="location" placeholder="예: 냉매창고 A"></div><div><label>담당자</label><input name="person" placeholder="입고 담당"></div></div><button style="margin-top:14px">입고 등록 및 QR 생성</button></form></div><div class="card"><h3>입고 처리 안내</h3><p class="muted">등록 시 고유 QR ID를 생성합니다. QR은 QR 라벨 탭에서 출력할 수 있습니다.</p></div>`}
function viewUse(){return data.cylinders.length?cylinderForm('use'):`<div class="card">먼저 용기를 입고 등록해 주세요.</div>`}
function viewRecovery(){return data.cylinders.length?cylinderForm('recovery'):`<div class="card">먼저 용기를 입고 등록해 주세요.</div>`}
function viewScan(){return `<div class="card"><h3>QR코드 스캔</h3><div class="actions noprint"><button onclick="startScan()">카메라 실행</button><button class="secondary" onclick="stopScan()">카메라 중지</button></div><div id="reader"></div><div id="scanresult"></div><p class="muted">카메라 권한을 허용하세요. HTTPS 또는 localhost에서만 카메라가 동작할 수 있습니다.</p></div>`}
function viewMonthly(){let months=[...new Set(data.logs.map(x=>x.date.slice(0,7)).concat(data.cylinders.map(x=>x.date.slice(0,7))))].sort().reverse();let rows=months.map(m=>{let ins=data.cylinders.filter(c=>c.date.startsWith(m)).reduce((s,c)=>s+c.initial,0)+data.logs.filter(x=>x.date.startsWith(m)&&x.type==='in').reduce((s,x)=>s+x.qty,0);let use=data.logs.filter(x=>x.date.startsWith(m)&&x.type==='use').reduce((s,x)=>s+x.qty,0);let rec=data.logs.filter(x=>x.date.startsWith(m)&&x.type==='recovery').reduce((s,x)=>s+x.qty,0);return `<tr><td>${m}</td><td>${fmt(ins)}</td><td>${fmt(use)}</td><td>${fmt(rec)}</td></tr>`}).join('');return `<div class="card"><h3>월별 입고·소모·회수량</h3><div class="scroll"><table><thead><tr><th>월</th><th>입고량</th><th>소모량</th><th>회수량</th></tr></thead><tbody>${rows||'<tr><td colspan="4">기록이 없습니다.</td></tr>'}</tbody></table></div><p class="muted">월별 입고는 신규 용기 등록 및 추가 입고 기록을 합산합니다.</p></div>`}
function viewLabels(){return `<div class="card"><h3>QR 라벨 인쇄</h3><p class="muted">등록된 용기별 QR코드가 생성됩니다. 인쇄 후 용기에 부착하세요.</p><button class="noprint" onclick="window.print()">라벨 인쇄</button></div><div id="qrprint">${data.cylinders.map(c=>`<div class="labelbox"><strong>${c.refrigerant}</strong><div>${c.code}</div><div id="qr-${c.id}"></div><small>${c.id}</small></div>`).join('')}</div>`}

function viewSettings(){return `<div class="card"><h3>냉매 종류 관리</h3><p class="muted">종류를 추가하거나 제거할 수 있습니다. 이미 등록된 용기 기록이 있는 종류도 목록에서 제거할 수 있으나, 과거 기록은 유지됩니다.</p><form id="catform"><div class="grid"><div><label>새 냉매 종류</label><input name="category" placeholder="예: R-1234ze" required></div></div><button style="margin-top:10px">냉매 종류 추가</button></form><div style="margin-top:14px">${settings.refrigerants.map(r=>`<div class="category-row"><span style="flex:1">${r}</span><button class="danger" onclick="removeCategory(${JSON.stringify(r)})">삭제</button></div>`).join('')||'<p class="muted">냉매 종류가 없습니다.</p>'}</div></div>
<div class="card"><h3>종류별 재고 알림 기준</h3><p class="muted">잔량이 기준량 이하일 때 경고가 표시됩니다.</p><form id="thresholdform"><div class="scroll"><table><thead><tr><th>냉매</th><th>알림 기준 (kg)</th><th>현재 잔량</th></tr></thead><tbody>${settings.refrigerants.map(r=>`<tr><td>${r}</td><td><input name="th_${r}" type="number" min="0" step="0.1" value="${settings.thresholds[r]||0}" placeholder="0=사용 안 함"></td><td>${fmt(categoryStock(r))}</td></tr>`).join('')}</tbody></table></div><button style="margin-top:12px">기준량 저장</button></form></div>
<div class="card"><h3>메일 알림 설정</h3><p class="muted">최대 10개 주소와 알림 주기를 설정합니다. 현재 HTML 단독 버전은 설정 저장 및 경고 표시까지만 가능하며, 자동 이메일 발송은 서버/메일 서비스 연결이 추가로 필요합니다.</p><form id="mailform"><label>수신 이메일 (최대 10개, 쉼표 또는 줄바꿈으로 구분)</label><textarea name="emails" rows="4" style="width:100%;padding:11px;border:1px solid #ccd6e1;border-radius:9px" placeholder="name@example.com">${settings.emails.join('\n')}</textarea><label>알림 송부 간격</label><select name="frequency"><option value="daily" ${settings.frequency==='daily'?'selected':''}>일 단위</option><option value="weekly" ${settings.frequency==='weekly'?'selected':''}>주 단위</option><option value="monthly" ${settings.frequency==='monthly'?'selected':''}>월 단위</option></select><button style="margin-top:12px">메일 설정 저장</button></form><div class="notice" style="margin-top:12px">자동 발송을 실제 활성화하려면 서버에서 정기 실행(스케줄)과 메일 발송 API 또는 SMTP 연동이 필요합니다. 이메일 비밀번호/API 키를 이 HTML에 넣지 마세요.</div></div>`}
function removeCategory(r){if(!confirm(r+' 종류를 목록에서 삭제할까요? 기존 용기 기록은 유지됩니다.'))return;settings.refrigerants=settings.refrigerants.filter(x=>x!==r);saveSettings()}

function recent(n){return `<div class="scroll"><table><thead><tr><th>날짜</th><th>종류</th><th>QR ID</th><th>수량</th><th>작업</th></tr></thead><tbody>${data.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n).map(x=>`<tr><td>${x.date}</td><td>${typeName(x.type)}</td><td>${x.cylinderId}</td><td>${fmt(x.qty)}</td><td>${x.work||'-'}</td></tr>`).join('')||'<tr><td colspan="5">기록이 없습니다.</td></tr>'}</tbody></table></div>`}
function typeName(t){return t==='in'?'추가 입고':t==='use'?'소모':'회수'}
function viewHistory(){return `<div class="card"><h3>전체 이력</h3><div class="actions noprint"><button onclick="exportCSV()">CSV/Excel용 내보내기</button><button class="secondary" onclick="backup()">JSON 백업</button><label style="margin:0"><input style="width:auto" type="file" accept=".json" onchange="restore(event)"> 백업 복원</label></div>${recent(1000)}</div>`}
function render(){nav();stats();let v=document.getElementById('view');let content={dashboard:viewDashboard,cylinders:viewCylinders,entry:viewEntry,use:viewUse,recovery:viewRecovery,scan:viewScan,monthly:viewMonthly,labels:viewLabels,history:viewHistory,settings:viewSettings};v.innerHTML=content[tab]();if(tab==='labels')data.cylinders.forEach(c=>{let el=document.getElementById('qr-'+c.id);if(el&&window.QRCode)new QRCode(el,{text:c.id,width:100,height:100})});bindForms()}
function bindForms(){let cf=document.getElementById('cform');if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf),id='RF-'+String(Date.now()).slice(-8);data.cylinders.push({id,refrigerant:f.get('refrigerant').trim(),code:f.get('code').trim(),initial:Number(f.get('qty')),date:f.get('date'),location:f.get('location'),person:f.get('person')});data.logs.push({type:'in',cylinderId:id,qty:Number(f.get('qty')),date:f.get('date'),person:f.get('person'),work:'신규 입고',note:f.get('location')});tab='labels';save();alert('입고 등록 완료! QR 라벨 탭에서 출력할 수 있습니다.')};let lf=document.getElementById('logform');if(lf)lf.onsubmit=e=>{e.preventDefault();let f=new FormData(lf),id=f.get('cylinder'),qty=Number(f.get('qty')),c=data.cylinders.find(c=>c.id===id),type=tab==='use'?'use':'recovery';if(type==='use'&&qty>balance(c)){alert('입력량이 현재 잔량보다 큽니다.');return}data.logs.push({type,cylinderId:id,qty,date:f.get('date'),person:f.get('person'),work:f.get('work'),note:f.get('note')});save();alert('기록이 저장되었습니다.')}}
let catf=document.getElementById('catform');if(catf)catf.onsubmit=e=>{e.preventDefault();let r=new FormData(catf).get('category').trim();if(!r)return;if(settings.refrigerants.includes(r)){alert('이미 등록된 냉매입니다.');return}settings.refrigerants.push(r);settings.thresholds[r]=settings.thresholds[r]||0;saveSettings();alert('냉매 종류가 추가되었습니다.');};let tf=document.getElementById('thresholdform');if(tf)tf.onsubmit=e=>{e.preventDefault();let f=new FormData(tf);settings.refrigerants.forEach(r=>settings.thresholds[r]=Number(f.get('th_'+r)||0));saveSettings();alert('기준량 저장 완료');};let mf=document.getElementById('mailform');if(mf)mf.onsubmit=e=>{e.preventDefault();let f=new FormData(mf),emails=String(f.get('emails')).split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);if(emails.length>10){alert('이메일 주소는 최대 10개까지 등록할 수 있습니다.');return}if(emails.some(x=>!/^\S+@\S+\.\S+$/.test(x))){alert('이메일 주소 형식을 확인하세요.');return}settings.emails=emails;settings.frequency=f.get('frequency');saveSettings();alert('메일 알림 설정이 저장되었습니다. 자동 발송은 서버 연결 후 활성화됩니다.');}
async function startScan(){if(!window.Html5Qrcode){alert('QR 스캔 라이브러리 로딩 실패. 인터넷 연결 확인');return}scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:230},decoded=>{stopScan();let c=data.cylinders.find(c=>c.id===decoded);document.getElementById('scanresult').innerHTML=c?`<div class="card"><h3>스캔 결과</h3><p><b>${c.refrigerant}</b> / ${c.code}</p><p>현재 잔량: <b>${fmt(balance(c))}</b></p><button onclick="tab='use';render()">사용 등록</button> <button class="secondary" onclick="tab='recovery';render()">회수 등록</button></div>`:`<p>등록되지 않은 QR: ${decoded}</p>`})}catch(e){alert('카메라 실행 실패: '+e)}}
async function stopScan(){if(scanner){try{await scanner.stop();scanner.clear()}catch(e){}scanner=null}}
function exportCSV(){let lines=[['유형','날짜','QR ID','냉매','용기번호','수량kg','작업자','작업','메모'].join(',')];data.logs.forEach(x=>{let c=data.cylinders.find(c=>c.id===x.cylinderId);lines.push([typeName(x.type),x.date,x.cylinderId,c?.refrigerant||'',c?.code||'',x.qty,x.person||'',x.work||'',x.note||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))});data.cylinders.forEach(c=>lines.push(['용기등록',c.date,c.id,c.refrigerant,c.code,c.initial,c.person||'','신규 입고',c.location||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')));let blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='냉매관리_이력.csv';a.click();URL.revokeObjectURL(a.href)}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='냉매관리_백업.json';a.click()}
function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();alert('복원 완료')}catch(err){alert('파일 형식 오류')}};r.readAsText(file)}
render();
setTimeout(()=>document.getElementById('intro')?.classList.add('fade'),2200);
</script></body></html>
